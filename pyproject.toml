[project]
name = "ai-spend-finops"
version = "0.1.0"
description = "AI spend and seat FinOps: vendor cost reconciliation, caps, anomaly alerts and seat true-ups."
requires-python = ">=3.12"
license = "MIT"

[project.scripts]
finops = "finops.cli:main"

[tool.setuptools.packages.find]
include = ["finops*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts, and made-up secrets, are the point of a test
"finops/sources/demo.py" = ["S311"]   # a seeded generator for sample data, not for security

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
